name: Update package-lock.json

on:
  push:
    paths:
      - "package.json"
  workflow_dispatch: # Allow manual triggering

jobs:
  update-package-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies and generate package-lock.json
        run: npm install

      - name: Install backend dependencies and generate backend/package-lock.json
        run: |
          cd backend
          npm install
          cd ..

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code package-lock.json || echo "changes_root=true" >> $GITHUB_OUTPUT
          git diff --exit-code backend/package-lock.json || echo "changes_backend=true" >> $GITHUB_OUTPUT

      - name: Commit and push if any package-lock.json has changed
        if: steps.git-check.outputs.changes_root == 'true' || steps.git-check.outputs.changes_backend == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package-lock.json backend/package-lock.json
          git commit -m "chore: update package-lock.json"
          git push
