name: Deploy

on:
  push:
    branches: [main, dev]

env:
  NODE_VERSION: "22.18.0"
  CF_ACCOUNT_ID: "1baf07e2bf54af133428fea840266f45"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Determine Target Environment ──────────────────────────────────
      - name: Configure Target Environment
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "CF_PROJECT=mars-2-0" >> $GITHUB_ENV
            echo "APP_URL=https://iam-mars.kz" >> $GITHUB_ENV
            echo "ENV_NAME=Production (iam-mars.kz)" >> $GITHUB_ENV
          else
            echo "CF_PROJECT=dev-mars-2-0" >> $GITHUB_ENV
            echo "APP_URL=https://next.iam-mars.kz" >> $GITHUB_ENV
            echo "ENV_NAME=Dev (next.iam-mars.kz)" >> $GITHUB_ENV
          fi

      # ── 2. Notify: started ────────────────────────────────────────────────
      - name: Telegram — started
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          MESSAGE=$(printf "🚀 <b>Deploy started</b> [%s]\n\n<b>Branch:</b> <code>%s</code>\n<b>Commit:</b> <code>%s</code>\n<b>By:</b> %s\n<a href=\"https://github.com/%s/actions/runs/%s\">→ View run</a>" "${ENV_NAME}" "${GITHUB_REF_NAME}" "${SHORT_SHA}" "${GITHUB_ACTOR}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}" > /dev/null

      # ── 3. Setup ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── 4. Build paraglide i18n ───────────────────────────────────────────
      - name: Build paraglide (i18n)
        run: npm run build:paraglide

      # ── 5. Deploy Convex backend ──────────────────────────────────────────
      - name: Deploy Convex backend
        run: npx convex deploy --check-build-environment disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # ── 6. Gate: type check ───────────────────────────────────────────────
      - name: Type check (tsc)
        run: npm run tsc

      # ── 7. Build frontend ─────────────────────────────────────────────────
      - name: Build frontend
        run: npm run build
        env:
          NODE_ENV: production
          NO_COLOR: "1"
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ── 8. Deploy to Cloudflare Pages ─────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist/ \
            --project-name "$CF_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      # ── 9. Notify: success ────────────────────────────────────────────────
      - name: Telegram — success
        if: success()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG="$(git log -1 --pretty=%s | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')"
          MESSAGE=$(printf "✅ <b>Deploy succeeded</b> [%s]\n\n<b>Branch:</b> <code>%s</code>\n<b>Commit:</b> <code>%s</code> — %s\n<b>By:</b> %s\n<a href=\"%s\">→ Open app</a>  |  <a href=\"https://github.com/%s/actions/runs/%s\">→ Run log</a>" "${ENV_NAME}" "${GITHUB_REF_NAME}" "${SHORT_SHA}" "${COMMIT_MSG}" "${GITHUB_ACTOR}" "${APP_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}" > /dev/null

      # ── 10. Notify: failure ───────────────────────────────────────────────
      - name: Telegram — failure
        if: failure()
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          COMMIT_MSG="$(git log -1 --pretty=%s 2>/dev/null | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' || echo 'unknown')"
          MESSAGE=$(printf "❌ <b>Deploy failed</b> [%s]\n\n<b>Branch:</b> <code>%s</code>\n<b>Commit:</b> <code>%s</code> — %s\n<b>By:</b> %s\n<a href=\"https://github.com/%s/actions/runs/%s\">→ View failed run</a>" "${ENV_NAME}" "${GITHUB_REF_NAME}" "${SHORT_SHA}" "${COMMIT_MSG}" "${GITHUB_ACTOR}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}" > /dev/null
