<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob: content:; worker-src 'self' blob:;"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#fff" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>Mars</title>

    <!-- Resource Hints for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Normalize trailing slashes BEFORE any framework loads -->
    <script>
      (function() {
        const pathname = window.location.pathname;
        // If path has trailing slashes (single or multiple) and is not root, normalize it
        if (pathname.length > 1 && pathname.endsWith('/')) {
          // Remove all trailing slashes
          const normalizedPath = pathname.replace(/\/+$/, '');
          // Also normalize multiple consecutive slashes in the middle
          const cleanPath = normalizedPath.replace(/\/+/g, '/');
          const newUrl = cleanPath + window.location.search + window.location.hash;
          console.log('[URL Normalize] Redirecting from', window.location.href, 'to', newUrl);
          // Use replaceState to avoid adding to history
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>

    <script>
      function forceReload() {
        return true;
        if (window.__BUILD_INFO__.environment == "production") {
          console.log(
            "[forceReload] Production environment detected, reloading page"
          );
          const form = document.createElement("form");
          form.method = "POST";
          form.action = location.href;
          document.body.appendChild(form);
          form.submit();
        } else {
          console.log(
            "[forceReload] Development environment detected, reloading page"
          );
          window.location.reload();
        }
      }
    </script>

    <!-- Legacy hash-based routing redirect removed - now using clean URLs -->

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const storedBuildInfo = localStorage.getItem("buildInfo");
        console.log(
          "[DOMContentLoaded] Stored build info found, checking version"
        );
        if (storedBuildInfo) {
          console.log(
            "[DOMContentLoaded] Stored build info found, checking version"
          );
          const buildInfo = JSON.parse(storedBuildInfo);
          if (buildInfo.version !== window.__BUILD_INFO__.version) {
            localStorage.setItem(
              "buildInfo",
              JSON.stringify(window.__BUILD_INFO__)
            );
            forceReload();
          }
        }
        forceReload();
      });
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/favicon.png" />
  </head>

  <body>
    <div id="app"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
