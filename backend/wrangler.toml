name = "mars-backend"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.

[vars]
JWT_SECRET = "0e3dff721c946ac26b873052e9e43560d0124d1548aa8cb8621daa6eb01c5735"
JWT_EXPIRY = "24h"
FRONTEND_URL_DEV = "https://mars-2-0.pages.dev"
FRONTEND_URL = "https://iam-mars.kz"

[[d1_databases]]
binding = "DB"
database_name = "mars-db"
database_id = "f1ed55ff-0477-49a2-b0f3-ecbed0f47c18"
migrations_dir = "prisma/migrations"

[[durable_objects.bindings]]
name = "WEBSOCKET_DO"
class_name = "WebSocketDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebSocketDurableObject"]

[dev]
port = 3001 